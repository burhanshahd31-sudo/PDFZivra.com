# Netlify serves the committed static export, not the Laravel application.

[build]
  command = "test -f public/index.html"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"
  # The static export does not need Artisan or a PHP application bootstrap.
  COMPOSER_FLAGS = "--no-scripts"

# Fallback redirect for Single Page Application / Static routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
