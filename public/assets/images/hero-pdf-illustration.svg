<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="100%" height="100%" fill="none">
    <defs>
        <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#1d4ed8"/>
        </linearGradient>
        <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#60a5fa"/>
            <stop offset="50%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#2563eb"/>
        </linearGradient>
        <linearGradient id="pdfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#f8fafc"/>
        </linearGradient>
        <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>
        <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1d4ed8" flood-opacity="0.25"/>
        </filter>
        <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.12"/>
        </filter>
    </defs>

    <!-- Background Ambient Glow -->
    <circle cx="260" cy="200" r="160" fill="#3b82f6" fill-opacity="0.08" />
    <circle cx="360" cy="140" r="100" fill="#06b6d4" fill-opacity="0.1" />

    <!-- Laptop Base -->
    <path d="M 100 310 L 420 310 L 440 326 C 440 330 435 334 425 334 L 95 334 C 85 334 80 330 80 326 Z" fill="#cbd5e1" />
    <path d="M 210 310 L 310 310 L 305 316 L 215 316 Z" fill="#94a3b8" />

    <!-- Laptop Screen Outer Frame -->
    <rect x="130" y="140" width="260" height="170" rx="14" fill="#0f172a" filter="url(#shadowGlow)"/>
    <!-- Screen Inner Display -->
    <rect x="138" y="148" width="244" height="154" rx="8" fill="url(#screenGrad)"/>

    <!-- Screen Graphic: Flow Lines & Grid -->
    <path d="M 150 260 Q 260 200 370 240" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
    <circle cx="260" cy="225" r="45" fill="#ffffff" fill-opacity="0.12"/>

    <!-- Emerging 3D PDF Document -->
    <g transform="translate(180, 70)" filter="url(#cardShadow)">
        <!-- Folded Corner Main Sheet -->
        <path d="M 0 16 C 0 7 7 0 16 0 L 115 0 L 155 40 L 155 190 C 155 199 148 206 139 206 L 16 206 C 7 206 0 199 0 190 Z" fill="url(#pdfGrad)" stroke="#e2e8f0" stroke-width="1.5"/>
        <!-- Fold Corner Triangle -->
        <path d="M 115 0 L 115 36 C 115 38 117 40 119 40 L 155 40 Z" fill="#e2e8f0"/>
        
        <!-- Red PDF Badge -->
        <rect x="22" y="32" width="54" height="24" rx="6" fill="#ef4444"/>
        <text x="49" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">PDF</text>
        
        <!-- Document Content Lines -->
        <rect x="22" y="74" width="110" height="8" rx="4" fill="#cbd5e1"/>
        <rect x="22" y="92" width="90" height="6" rx="3" fill="#e2e8f0"/>
        <rect x="22" y="106" width="105" height="6" rx="3" fill="#e2e8f0"/>
        <rect x="22" y="120" width="80" height="6" rx="3" fill="#e2e8f0"/>
        
        <!-- Graph Illustration inside doc -->
        <rect x="22" y="140" width="110" height="42" rx="6" fill="#f1f5f9"/>
        <path d="M 32 170 L 55 155 L 75 162 L 98 148 L 120 156" stroke="#3b82f6" stroke-width="2.5" fill="none"/>
        <circle cx="55" cy="155" r="3" fill="#3b82f6"/>
        <circle cx="98" cy="148" r="3" fill="#3b82f6"/>
    </g>

    <!-- Floating Cloud Icon (Left Top) -->
    <g transform="translate(60, 90)" filter="url(#cardShadow)">
        <circle cx="35" cy="35" r="30" fill="url(#cloudGrad)"/>
        <path d="M 24 38 C 21 38 19 36 19 33 C 19 30 21 28 24 28 C 24 25 27 22 31 22 C 35 22 38 25 38 28 C 42 28 45 30 45 34 C 45 38 42 41 38 41 L 24 41" fill="#ffffff"/>
    </g>

    <!-- Floating Tool Tile: Word DOCX (Left Middle) -->
    <g transform="translate(45, 185)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="52" height="52" rx="12" fill="#2563eb"/>
        <path d="M 16 18 L 22 34 L 26 24 L 30 34 L 36 18" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Floating Tool Tile: Excel XLSX (Right Top) -->
    <g transform="translate(390, 80)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="52" height="52" rx="12" fill="#10b981"/>
        <path d="M 18 18 L 34 34 M 34 18 L 18 34" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Floating Tool Tile: Images JPG/PNG (Right Middle) -->
    <g transform="translate(415, 175)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="52" height="52" rx="12" fill="#f59e0b"/>
        <circle cx="21" cy="22" r="4" fill="#ffffff"/>
        <path d="M 14 36 L 24 26 L 31 33 L 38 27 L 42 36 Z" fill="#ffffff"/>
    </g>

    <!-- Floating Tool Tile: Lock / Security (Right Bottom) -->
    <g transform="translate(370, 260)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="48" height="48" rx="12" fill="#8b5cf6"/>
        <rect x="16" y="22" width="16" height="14" rx="3" fill="#ffffff"/>
        <path d="M 20 22 L 20 17 C 20 14.8 21.8 13 24 13 C 26.2 13 28 14.8 28 17 L 28 22" stroke="#ffffff" stroke-width="2.5" fill="none"/>
    </g>
</svg>
